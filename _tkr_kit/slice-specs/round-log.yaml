capability: round-log
slice_specs:
  - slice: 1
    behavior:
      - Reloads on window focus and after edits or removals
      - No pagination
      - Subscribe to committed edits, removals and restorations from the shared
        container, re-read on focus and display loading separately from an empty
        log.
    errors:
      - Errors held in `error`, rendered in place
    interface:
      - 'export interface RoundListItem { round: StoredRound; totals:
        RoundTotals }'
      - 'export function useRoundList(c: Container): { inProgress: RoundListItem
        | null; finished: RoundListItem[]; loading: boolean; error: StorageError
        | null; reload(): Promise<void> }'
    purpose: 'Load the log: the round in progress first, then finished rounds newest
      first.'
    status: done
    tests:
      - Covered by round-log slice 4
    title: Round list view-model
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Round list screen
    purpose: 'Browse every round. Wireframes: round-list-mobile.svg and
      round-list-empty-mobile.svg.'
    interface:
      - 'export function RoundList(): JSX.Element'
    behavior:
      - In-progress row pinned at the top with a selection bar, persisted draft
        cursor or lifecycle step, score to par and Resume. Mention 18 holes only
        after the stored decision to continue.
      - 'Finished rows: zero-padded index, date, ''9 holes''/''18 holes'' as
        metadata (not a badge), score to par in display type, stat line'
      - '''New round'' in the header, disabled with ''Round in progress'' while
        one exists'
      - 'Empty state: ''Your scorecards will appear here'' and ''Start your
        first round'''
      - A pending abandoned round disables New round with an Undo or Dismiss
        reason. Loading and read errors never masquerade as an empty log.
      - Render local calendar dates without a UTC day shift; stale visible
        content remains available during refresh failures.
    errors: []
    tests:
      - Covered by round-log slice 4
    slice: 2
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Wire round-history
    purpose: Register the log route as the start-up fallback.
    interface:
      - 'src/app/routes.ts: { path: ''/log'', view: RoundList }'
    behavior: []
    errors: []
    tests:
      - Typecheck; behaviour covered by slice 4
    slice: 3
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Test round-history
    purpose: Prove the log lists rounds correctly.
    interface:
      - src/ui/log/useRoundList.test.ts
      - e2e/round-history.spec.ts
    behavior:
      - No module mocking (vi.mock / spyOn); collaborators are injected.
    errors: []
    tests:
      - Seeded 9- and 18-hole rounds list newest first with matching totals
      - Empty log shows the start action
      - In-progress round is pinned and Resume opens its next hole
      - '''New round'' is disabled with its reason while a round is in progress'
    slice: 4
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Round detail view-model
    purpose: Load one round, correct a hole, remove and restore.
    interface:
      - 'export function useRoundDetail(c: Container, roundId: string,
        navigateTo?: (path: string) => Promise<void>): { round: StoredRound |
        null; totals: RoundTotals | null; editing: number | null; edit(n: number
        | null): void; saveHole(h: Hole): Promise<void>; remove():
        Promise<void>; restore(): Promise<void>; error: StorageError | null }'
    behavior:
      - Own an isolated container.createSession editor and unregister it on
        disposal. Restore its persisted correction cursor and drafts. Keep
        editor identity stable across autosaves; explicit conflict recovery
        resets its editor version.
      - saveHole uses repository.updateHole and recomputes totals
      - remove uses trash.removeRound and routes to the log with the undo bar
      - Restore and autosave per-hole correction drafts through the same
        serialized revision-aware writer. Save commits updateHole; Cancel
        explicitly discards only that draft and restores the confirmed values.
      - Removal delegates to the app-level pending-removal controller; routing
        never owns or destroys undo state. If save/remove fails retain the
        screen, data and retry action.
    errors:
      - Flush all writers before removal; suppress own removal refresh, then
        dispose the removed editor before navigating. A failed navigation
        retains removed context and global Undo rather than fabricating a
        missing-round read.
      - Unknown id → StorageError not-found, rendered in place
    tests:
      - Covered by round-log slice 9
    slice: 5
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Round detail screen with in-place correction
    purpose: 'Fix a logged round without leaving it. Wireframe:
      round-detail-mobile.svg.'
    interface:
      - 'export function RoundDetail(props: { params: { id: string } }):
        JSX.Element'
    behavior:
      - 'Header: date, holes, score to par; stat row'
      - ScorecardTable with onHoleSelect; the selected row opens HoleEditor
        (compact layout) inline beneath it
      - Save and Cancel are 48px tall (the wireframe's 40px editor buttons are
        raised to the touch-target norm)
      - Reopening a detail with persisted correction drafts restores its
        selected editor. Save and Cancel act on that draft; the list still uses
        confirmed totals.
    errors: []
    tests:
      - Covered by round-log slice 9
    slice: 6
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Remove round with undo
    purpose: 'Remove a round without a confirmation dialog. Wireframe:
      round-removed-undo-mobile.svg.'
    interface:
      - 'export function RemoveRound(props: { onRemove(): Promise<void> }):
        JSX.Element'
    behavior:
      - Remove atomically creates the persistent pending-removal token, then
        routes to the log. Undo and Dismiss are rendered by the app-level
        controller; no countdown or unmount purge.
      - Disable another removal with a visible reason until the current one is
        undone or dismissed. On failure show retry beside the operation.
    errors: []
    tests:
      - Covered by round-log slice 9
    slice: 7
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Wire round-detail
    purpose: Register the detail route and link list rows to it.
    interface:
      - 'src/app/routes.ts: { path: ''/log/:id'', view: RoundDetail }'
      - 'RoundList rows link to #/log/<id>'
    behavior: []
    errors: []
    tests:
      - Typecheck; behaviour covered by slice 9
    slice: 8
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - status: done
    title: Test round-detail
    purpose: Prove correction and undoable removal end to end.
    interface:
      - src/ui/log/useRoundDetail.test.ts
      - e2e/round-detail.spec.ts
    behavior:
      - No module mocking (vi.mock / spyOn); collaborators are injected.
    errors: []
    tests:
      - Correction drafts survive navigation and restart; Cancel preserves the
        confirmed hole; Save updates detail and list totals and par memory.
      - Remove → navigate → restart → Undo restores every field; explicit
        Dismiss purges only its token.
      - Concurrent tabs cannot overwrite a correction or create a second pending
        removal. Failed remove/restore/dismiss shows an actionable inline error
        and retains recoverable data.
    slice: 9
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification

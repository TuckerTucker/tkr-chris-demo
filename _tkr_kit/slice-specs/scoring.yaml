capability: scoring
slice_specs:
  - slice: 1
    behavior:
      - number is an integer 1–18
      - par is an integer 3–5
      - strokes is an integer ≥ 1
      - putts is an integer with 0 ≤ putts ≤ strokes − 1 (the tee shot is never
        a putt)
      - fairway is 'n/a' if and only if par is 3
      - Every broken rule is returned, not just the first, so the UI can show
        them all inline
      - validateHole delegates to the same field rules as validateHoleDraft;
        null fairway yields a required-field error for par 4/5. Numeric values
        must be finite safe integers; no silent coercion. Drafts may contain
        invalid combinations, but confirmed Hole values may not.
    errors:
      - 'Pure function: returns errors, never throws'
    interface:
      - export type Fairway = 'hit' | 'missed' | 'n/a'
      - 'export interface Hole { readonly number: number; readonly par: number;
        readonly strokes: number; readonly putts: number; readonly fairway:
        Fairway }'
      - export type HoleField = 'number' | 'par' | 'strokes' | 'putts' |
        'fairway'
      - 'export interface HoleError { readonly field: HoleField; readonly code:
        string; readonly message: string }'
      - 'export function validateHole(hole: Hole): HoleError[]'
      - 'export interface HoleDraft { readonly number: number; readonly par:
        number; readonly strokes: number; readonly putts: number; readonly
        fairway: Fairway | null }'
      - 'export function validateHoleDraft(draft: HoleDraft): HoleError[]'
    purpose: Define a hole and every rule that makes one valid, in one place the UI
      and storage both trust.
    status: approved
    tests:
      - Ace (par 3, 1 stroke, 0 putts) is valid
      - putts = strokes is rejected with code 'putts-not-below-strokes'
      - par 3 with fairway 'hit' is rejected
      - par 4 with fairway 'n/a' is rejected
      - Reject NaN, Infinity, fractional numbers, unsafe integers, unknown
        fairway strings and out-of-range hole numbers; cover every error code.
    title: Hole type and validation
  - status: approved
    title: Hole derivations
    purpose: Work out GIR, fairway eligibility and score to par so they are never
      asked for and never disagree with the inputs.
    interface:
      - 'export function isGreenInRegulation(hole: Pick<Hole, ''par'' |
        ''strokes'' | ''putts''>): boolean'
      - 'export function isFairwayEligible(par: number): boolean'
      - 'export function scoreToPar(hole: Pick<Hole, ''par'' | ''strokes''>):
        number'
    behavior:
      - GIR is strokes − putts ≤ par − 2
      - Fairway is eligible when par is 4 or 5
      - Score to par is strokes − par
    errors:
      - Callers pass validated holes; derivations do not re-validate
    tests:
      - GIR boundaries for par 3, 4 and 5 (on the line, and one stroke over)
      - Eligibility for par 3, 4 and 5
    slice: 2
  - status: approved
    title: Wire hole-rules
    purpose: Expose the hole rules through one domain barrel.
    interface:
      - 'src/domain/index.ts: named re-exports of Hole, Fairway, HoleError,
        validateHole, isGreenInRegulation, isFairwayEligible, scoreToPar'
      - src/domain/index.ts also exports HoleDraft and validateHoleDraft
    behavior:
      - No default exports
      - No module outside src/domain imports a src/domain file other than
        index.ts
    errors: []
    tests:
      - Typecheck passes when importing every name from src/domain
    slice: 3
  - status: approved
    title: Test hole-rules
    purpose: Pin every hole rule with table-driven tests.
    interface:
      - src/domain/hole.test.ts
      - src/domain/hole-derivations.test.ts
    behavior:
      - One table row per rule boundary; each row names the rule it guards
    errors: []
    tests:
      - Removing any validation rule makes at least one row fail
    slice: 4
  - status: approved
    title: Round type and length rules
    purpose: Model a round and the 9-or-18 decision at the turn.
    interface:
      - export type RoundStatus = 'in-progress' | 'finished'
      - 'export interface Round { readonly id: string; readonly date: string;
        readonly revision: number; readonly continuedTo18: boolean; readonly
        status: RoundStatus; readonly holes: readonly Hole[] }'
      - export type NextStep = 'enter-hole' | 'turn' | 'finish' | 'finished'
      - 'export function validateRound(round: Round): RoundError[]'
      - 'export function nextStep(round: Round): NextStep'
      - 'export function canFinish(round: Round): boolean'
      - 'export interface RoundError { readonly field: ''id'' | ''date'' |
        ''revision'' | ''status'' | ''continuedTo18'' | ''holes''; readonly
        code: string; readonly message: string; readonly holeNumber?: number }'
      - 'export class RoundValidationError extends Error { readonly errors:
        readonly RoundError[] }'
    behavior:
      - Date is a valid local-calendar yyyy-mm-dd date; id is nonempty; revision
        is a nonnegative safe integer. All holes are validated, ordered and
        contiguous from 1, with no duplicates and at most 18.
      - A new round has continuedTo18=false. Exactly 9 recorded holes with false
        yields turn; with true yields enter-hole for hole 10. Holes 10–18
        require continuedTo18=true.
      - An in-progress round at 18 yields finish, never finished. Only persisted
        status finished yields finished. Finished rounds contain exactly 9 holes
        with continuedTo18=false or 18 with true.
      - canFinish requires in-progress and either exactly 9 holes without
        continuing or exactly 18 after continuing. nextStep validates the round
        before deriving its step.
    errors:
      - nextStep throws RoundValidationError with RoundError diagnostics for an
        invalid round; validateRound returns errors without throwing. Storage
        wraps diagnostics as StorageError invalid for writes or corrupt for
        persisted records.
    tests:
      - Table cases at 0, 8, 9 undecided, 9 continued, 10, 17, 18 awaiting
        finish and finished 9/18.
      - Reject duplicate/gapped/out-of-order holes, invalid dates, a finished
        8-hole round, and a continued round finished at 9.
    slice: 5
  - status: approved
    title: Round totals
    purpose: One function gives the running totals during a round and the final
      totals after it.
    interface:
      - 'export interface RoundTotals { readonly holesPlayed: number; readonly
        par: number; readonly strokes: number; readonly scoreToPar: number;
        readonly putts: number; readonly gir: number; readonly girPct: number |
        null; readonly fairwaysHit: number; readonly fairwaysEligible: number;
        readonly fairwayPct: number | null }'
      - 'export function roundTotals(holes: readonly Hole[]): RoundTotals'
    behavior:
      - Percentages are rounded to whole numbers
      - girPct is null when holesPlayed is 0
      - fairwayPct is null when fairwaysEligible is 0 (e.g. only par 3s played)
      - Par-3 holes never count towards fairways
    errors: []
    tests:
      - Empty round and all-par-3 round produce null percentages for zero
        denominators.
      - Explicit validated 9- and 18-hole fixture arrays with independently
        calculated totals; illustrative wireframe headline numbers are not a
        test oracle.
      - Correcting any hole recomputes all affected totals, including changing
        par to/from 3.
    slice: 6
  - status: approved
    title: ParSource port and manual ParSource
    purpose: 'The seam where par comes from: typed by the golfer today, a course
      card later.'
    interface:
      - 'export interface ParMemory { lastPar(holeNumber: number):
        Promise<number | undefined> }'
      - 'export interface ParSource { suggestPar(holeNumber: number):
        Promise<number> }'
      - 'export function createManualParSource(memory: ParMemory): ParSource'
    behavior:
      - suggestPar returns the remembered par for that hole number, otherwise 4
      - No storage code is imported; memory is injected
      - Validate requested hole number and remembered par against supported
        bounds. Invalid persisted memory must surface a typed validation
        failure, never suggest an unsupported par.
    errors:
      - A memory read failure propagates (the caller shows it in place)
    tests:
      - Suggests the remembered par
      - Suggests 4 for an unknown hole
    slice: 7
  - status: approved
    title: Wire round-rules
    purpose: Add the round rules and the ParSource port to the domain barrel.
    interface:
      - 'src/domain/index.ts: add Round, RoundStatus, NextStep, nextStep,
        canFinish, RoundTotals, roundTotals, ParMemory, ParSource,
        createManualParSource'
      - src/domain/index.ts also exports validateRound
      - src/domain/index.ts exports RoundError and RoundValidationError.
    behavior:
      - Barrel stays named-exports-only
    errors: []
    tests:
      - Typecheck passes importing every new name
    slice: 8
  - status: approved
    title: Test round-rules
    purpose: Pin the round rules, totals and ParSource behaviour.
    interface:
      - src/domain/round.test.ts
      - src/domain/totals.test.ts
      - src/domain/par-source.test.ts
    behavior:
      - The ParSource test injects a hand-written in-test ParMemory
        implementation. No module mocking (vi.mock / spyOn); collaborators are
        injected.
    errors: []
    tests:
      - All rows pass; changing the GIR formula fails the totals test
    slice: 9

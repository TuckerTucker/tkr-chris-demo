capability: round-storage
features:
  - name: round-repository
    acceptance_criteria:
      - Saving a hole is durable once its promise resolves; a reload shows it
      - At most one round is in progress; it is found on start-up
      - Finished rounds list newest first
      - Delete moves a round to the undo buffer; restore brings it back; purge
        removes it for good
      - The database is versioned and migrations run forward on open without
        data loss
      - Every storage failure is raised as a typed StorageError (quota,
        unavailable, blocked, corrupt)
    dependencies:
      capabilities:
        - scoring (Round and Hole types the repository stores)
      features: []
    scope_in:
      - IndexedDB schema and versioned migrations
      - RoundRepository interface and its IndexedDB implementation
      - Delete, restore and purge (the undo buffer)
      - Typed storage errors
    scope_out:
      - Standalone par-memory reader/writer factory (par-memory); hole mutations
        already update the schema-owned par-memory store atomically.
      - Sync, export, import
    slice_decomposition_guide: Errors and the schema/migration layer first (every
      store depends on them), then the repository, then delete-with-undo.
      Declare retention on every new store.
    status: done
    user_story: As a golfer, I want every hole saved the moment I enter it and my
      rounds kept on my phone, so that nothing I have recorded is ever lost and
      an interrupted round picks up where I left off.
    wiring_assignment:
      territory:
        - src/storage/**
        - package.json
        - package-lock.json
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - name: par-memory
    status: done
    user_story: As a golfer who keeps playing the same course, I want par filled in
      from what I entered for that hole number last time, so that I rarely have
      to change it.
    acceptance_criteria:
      - Recording a hole stores its par against the hole number, replacing the
        previous value
      - The stored par is readable through the reader interface that the manual
        ParSource takes
      - The store holds at most one entry per hole number (1–18)
    scope_in:
      - Par memory store (hole number to last par)
      - Reader and writer interfaces satisfying the domain's ParMemory port
    scope_out:
      - Course cards (course-scorecard)
    dependencies:
      features:
        - round-repository (schema and migration path the new store is added
          through)
      capabilities:
        - scoring (ParMemory port)
    slice_decomposition_guide: Implement the reader/writer over the existing v1
      par-memory store, then wire and test; do not recreate it or add a
      redundant migration.
    wiring_assignment:
      territory:
        - src/storage/**
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification

capability: app-shell
features:
  - name: offline-shell
    acceptance_criteria:
      - After one online visit, every asset needed to play is cached and the app
        loads offline
      - The app installs to the home screen with a name and icon
      - An app update never breaks or discards an in-progress round
    dependencies:
      features: []
      capabilities:
        - platform (project scaffold and build)
    scope_in:
      - Web app manifest and icons
      - Service worker precaching (vite-plugin-pwa)
      - Update handling that applies a new version only between rounds or at a
        safe launch with every live client ready
    scope_out:
      - Background sync, push notifications
    slice_decomposition_guide: Manifest and icons first, then the service worker and
      its update policy, then wire the manifest into index.html.
    status: in_progress
    user_story: As a golfer on a course with no signal, I want the app to open and
      work fully from my phone's home screen, so that I can score a round
      anywhere.
    wiring_assignment:
      territory:
        - vite.config.ts
        - index.html
        - public/**
        - src/app/sw-update.ts
        - src/app/sw-coordinator.js
        - tsconfig.json
        - tsconfig.vite.json
        - package.json
        - package-lock.json
        - src/main.tsx
  - name: ui-kit
    status: done
    user_story: As a golfer using one hand in bright sun, I want large,
      high-contrast controls that work the same on every screen, so that
      entering and correcting scores is fast and hard to get wrong.
    acceptance_criteria:
      - Steppers and chip toggles have touch targets of at least 48×48 CSS px
        and work by touch, keyboard and screen reader
      - A disabled control shows why it is disabled
      - Status and errors are shown in place next to the action, never as a toast
      - The undo bar offers undo for a destructive action and closes only after
        successful Undo or explicit Dismiss
      - The theme follows system dark mode, reduced motion and text size, and
        meets WCAG 2.1 AA contrast
    scope_in:
      - Theme tokens (light, dark, high contrast)
      - Stepper and chip toggle controls
      - Scorecard table (per-hole grid with totals) used by the round summary
        and round detail
      - Inline status/error component
      - Undo bar
    scope_out:
      - Screen-specific layouts (round-entry, round-log)
    dependencies:
      features: []
      capabilities:
        - platform (build and browser test tooling)
        - scoring (hole and total types)
    slice_decomposition_guide: Theme first, then input controls, then display
      components. Each component takes its data and callbacks as props; none
      reads storage.
    wiring_assignment:
      territory:
        - src/ui/kit/**
        - package.json
        - package-lock.json
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - name: composition-root
    status: done
    user_story: As a golfer opening the app, I want to land on my round in progress,
      or on my log if no round is in progress, so that I never have to look for
      where I was.
    acceptance_criteria:
      - main.tsx builds the ParSource, RoundRepository, par memory and logger
        once and injects them; no screen builds its own
      - Start-up resumes the active draft, undecided turn, next hole or pending
        finish; without an active round it opens the log
      - Navigation moves between the current round and the log without a full
        page reload
      - A storage failure at start-up is shown in place with what to do next
        (e.g. check site storage permissions)
      - App events are logged as structured JSON (pino browser)
    scope_in:
      - Composition root and dependency container
      - Start-up routing and navigation
      - App-wide error boundary that renders in place
      - Structured logger
    scope_out:
      - Screen content
    dependencies:
      features:
        - offline-shell (scaffold)
        - ui-kit (in-place status component)
      capabilities:
        - scoring (ParSource)
        - round-storage (RoundRepository, par memory)
    slice_decomposition_guide: Logger and container first, then the router, then the
      error boundary. The screens themselves are mounted by the round-entry and
      round-log wiring slices.
    wiring_assignment:
      territory:
        - src/main.tsx
        - src/app/**
        - package.json
        - package-lock.json
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification

<text x="0" y="16" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" letter-spacing="1.44" fill="#666666">NO ROUNDS YET</text><text x="0" y="56" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#000000">Your scorecards</text><text x="0" y="88" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#000000">will appear here</text><text x="0" y="120" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">Record a round hole by hole. Every</text><text x="0" y="144" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#666666">finished round lands in this log.</text>
</g>


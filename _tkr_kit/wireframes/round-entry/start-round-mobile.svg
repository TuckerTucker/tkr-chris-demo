</g>

<g id="actions__button-primary-start-round_0" transform="translate(16, 736)">
<rect x="0" y="0" width="336" height="56" fill="#E3000B"/><text x="168" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Start round</text>
</g>

</svg>
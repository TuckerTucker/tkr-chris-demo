capability: round-storage
slices:
  - number: 1
    delivers: Typed StorageError kinds unavailable, quota, blocked, corrupt,
      not-found, invalid, conflict and io, with preserved cause, inline field
      errors and actionable hints.
    depends_on: []
    feature: round-repository
    layer: data
    paths:
      - src/storage/errors.ts
    status: done
    story_ids: []
    title: Typed storage errors
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification
  - feature: round-repository
    number: 2
    depends_on:
      - 1
    paths:
      - src/storage/database.ts
      - src/storage/migrations.ts
      - package.json
      - package-lock.json
    delivers: '`openGolfDatabase(name)` over `idb`, with an ordered list of
      migrations that only runs forward. Version 1 creates the object stores
      `rounds` (keyPath id, index by status and date), `trash` and `par-memory`.
      Opening when IndexedDB is unavailable or blocked raises a StorageError.'
    new_stores:
      - name: indexeddb:golf-scorecard/rounds
        retention:
          kind: op
          op: RoundTrash.removeRound then RoundTrash.purgeTrash(token)
          trigger: manual
          detail: Round and up to 18 embedded drafts are retained until user removal and
            explicit undo dismissal.
      - name: indexeddb:golf-scorecard/trash
        retention:
          kind: bounded
          detail: At most one pending removal, including its embedded drafts; kept across
            restart until explicit Undo or Dismiss. Only the matching token can
            be purged.
      - name: indexeddb:golf-scorecard/par-memory
        retention:
          kind: bounded
          detail: Keyed by hole number 1-18 and replaced on write, so it never holds more
            than 18 entries.
    title: Database schema and migrations
    layer: data
    story_ids: []
    status: done
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification

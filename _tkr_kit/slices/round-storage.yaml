    number: 3
    depends_on:
      - 2
    paths:
      - src/storage/round-repository.ts
    delivers: Revision-checked repository with draft autosave, contiguous
      append/correction, persistent turn choice, atomic hole plus par-memory
      commits and explicit finish; no lifecycle or persistence error escapes
      untyped.
    title: RoundRepository
    layer: data
    story_ids: []
    status: done
    evidence:
      kind: manual
      ref: docs/audits/2026-10-15-implementation.md#final-candidate-verification

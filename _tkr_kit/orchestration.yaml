  readiness:
  - All twelve features are implemented. Direct candidate validation passed 225 unit, 167 browser
    and 81 production E2E tests after a clean install. Fifty-nine slices/specs, eleven features and
    five capabilities are done. App-shell slice/spec 4, offline-shell, app-shell and the product
    remain in progress pending physical phone installation acceptance. Course scorecard stays deferred.
  - Completion uses manual evidence in docs/audits/2026-10-15-implementation.md and its source manifest;
    no formal orchestrator gate receipts were fabricated. Listed assignment hashes describe the
    verified execution plans before done entities were excluded by future plan generation.
  - Use Node ^22.13.0, ^24.0.0 or >=26.0.0, then npm ci and explicit browser setup. Current local Node
    20.19.5 is incompatible with Vitest 5. TypeScript is pinned to compatible 6.0.3.
  - 'Feature runs are serialized in listed order, including offline-shell and ui-kit: package.json and
    package-lock.json are shared writable territory. Within a run only dependency-independent, disjoint
    slice assignments may overlap.'
  - Package owners may edit both package.json and package-lock.json. Regenerate and compare full plan
    hashes immediately before each run; re-review changed contracts.
  - The host coordinator must resolve real agent/skill defaults, applicable gate executors and evidence
    locations before start_run. Labels alone are not executable implementations; no coordinator is attached
    in this repo.
  - Gate each slice against its own acceptance checks and already-built regressions. A tests gate cannot
    demand later screens; cross-feature end-to-end acceptance runs after the owning UI feature. Never
    record done without gate evidence.
  - Browser setup is separate from test execution; first scaffold must mount src/main.tsx and exercise
    actual IndexedDB before later features run.
  - Before release run the complete check suite, offline full-round/restart/edit flow, two-build multi-tab
    update tests and physical phone checks. Plan approval supplies no passing runtime evidence.

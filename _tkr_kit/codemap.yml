semantic:
  "~read_first": "Follow nav.start, then the relevant controller and repository before changing a screen."
  "~course_extension": "Implement ParSource after choosing course data; keep scoring independent of lookup."
  "~save_bug": "Distinguish localDrafts, durable drafts, confirmed holes and revision conflicts before altering save behavior."
  "~release": "Use the physical acceptance runbook and the installed build ID; do not substitute emulation evidence."
